<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FURTHER · seven rooms past the ancient signal</title>
<meta name="description" content="A walk-through by Unity and Charlie. Seven rooms that go further than the ancient signal. Meta Quest, phone or desktop.">
<style>
html,body{margin:0;height:100%;background:#05030a;color:#efe6ff;font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage canvas{display:block;width:100vw;height:100vh}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;padding:24px;box-sizing:border-box;
  background:radial-gradient(ellipse at 50% 40%,#3a1650 0%,#160822 45%,#05030a 80%);overflow:hidden}
#start:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,#ff9a3c22,#5af0d822,#c04cff22,#ff9a3c22);animation:spin 90s linear infinite;filter:blur(40px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{letter-spacing:.32em;opacity:.92}50%{letter-spacing:.42em;opacity:1}}
#start>*{position:relative}
h1{font-weight:400;font-size:clamp(44px,10vw,96px);margin:0 0 6px;letter-spacing:.35em;animation:breathe 10s ease-in-out infinite;text-shadow:0 0 30px #ff9a3c88}
.sub{font-style:italic;opacity:.85;margin-bottom:26px;font-size:clamp(15px,2.4vw,20px)}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-size:20px;letter-spacing:.12em;color:#fff;background:#ffffff14;border:1px solid #ffffff55;border-radius:999px;padding:16px 30px;min-height:60px;cursor:pointer}
button.main{background:linear-gradient(90deg,#ff9a3c,#c04cff);border:none;color:#140620;font-weight:600}
button:disabled{opacity:.45}
.small{max-width:560px;margin-top:24px;font-size:14px;line-height:1.5;opacity:.75}
#hud{position:fixed;left:0;right:0;top:18px;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 0 12px #000,0 0 3px #000;z-index:3}
#rname{font-size:clamp(20px,3.6vw,34px);letter-spacing:.25em;color:#ffe9c4}
#rline{font-style:italic;font-size:clamp(14px,2.2vw,19px);opacity:.9;margin-top:6px;padding:0 20px}
#msg{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:80vw;text-align:center;font-size:18px;opacity:0;pointer-events:none;text-shadow:0 0 10px #000,0 0 3px #000;z-index:3}
#bar{position:fixed;right:12px;bottom:12px;display:none;gap:8px;z-index:4}
#bar button{font-size:14px;padding:10px 16px;min-height:44px;background:#0008}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff55;display:none;z-index:4;pointer-events:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff66}
#stats{position:fixed;left:8px;top:8px;font:12px monospace;color:#7f7;z-index:5;display:none}
#live{position:fixed;left:8px;bottom:8px;font:12px monospace;color:#f9a;z-index:5;display:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff8;z-index:2;display:none;pointer-events:none}
body.playing #bar{display:flex}
body.playing.desk #cross{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="start">
  <h1>FURTHER</h1>
  <div class="sub">seven rooms past the ancient signal</div>
  <div class="btns">
    <button id="bEnterVR" class="main">ENTER VR</button>
    <button id="bWalk">WALK IN</button>
  </div>
  <div class="small" id="how"></div>
  <div class="small">Slow shifting colours, moving patterns and music. Nothing flashes. If it ever gets too much: press B or Y in VR, G on a keyboard, or ◎ on screen, and everything slows and softens for a while. Headphones help.</div>
</div>
<div id="hud" data-t="0"><div id="rname"></div><div id="rline"></div></div>
<div id="msg"></div>
<div id="bar"><button id="bGround" title="Ground me">◎ GROUND</button><button id="bSound">SOUND ON</button><button id="bVR">VR</button></div>
<div id="stick"><div id="knob"></div></div>
<div id="cross"></div>
<div id="stats"></div>
<div id="live">LIVE</div>
<script>window.FURTHER_VER='202610150419';</script>
<script src="js/three.min.js?v=202610150419"></script>
<script src="js/core.js?v=202610150419"></script>
<script src="js/rooms.js?v=202610150419"></script>
<script src="js/main.js?v=202610150419"></script>
</body>
</html>
